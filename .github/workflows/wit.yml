name: Validate WIT

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.259.0 --locked
      - name: Parse and validate contract
        run: |
          wasm-tools component wit wit --wasm --output "$RUNNER_TEMP/cardbe-plugin-api.wasm"
          wasm-tools validate "$RUNNER_TEMP/cardbe-plugin-api.wasm"
